name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core-tests:
    name: Testes do LifeResetCore
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: Packages/LifeResetCore
        run: swift test

  build-ipa:
    name: Build da app (.ipa sem assinatura)
    needs: core-tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar XcodeGen e ldid
        run: brew install xcodegen ldid

      - name: Gerar projeto Xcode
        run: xcodegen generate

      - name: Compilar (sem assinatura)
        run: |
          xcodebuild \
            -project LifeReset.xcodeproj \
            -scheme LifeReset \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Embutir entitlements (App Group)
        run: |
          APP=build/Build/Products/Release-iphoneos/LifeReset.app
          ldid -SLifeReset/Resources/LifeReset.entitlements "$APP/LifeReset"

      - name: Criar .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/LifeReset.app Payload/
          zip -qry LifeReset.ipa Payload
          ls -lh LifeReset.ipa

      - name: Guardar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: LifeReset-ipa
          path: LifeReset.ipa

      - name: Publicar release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LIFE RESET (build ${{ github.run_number }})
          prerelease: true
          body: IPA sem assinatura. Tem de ser assinado no sideload (AltStore ou Sideloadly). Ver README.
          files: LifeReset.ipa
